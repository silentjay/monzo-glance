# Monzo Glance / monzo-glance: every setting, with its default.
#
# Copy this file to ~/.config/monzo-glance/config.toml and change what you like. The file is
# optional: without it the defaults below apply. The engine only reads it, never writes it.
# A value the engine cannot use is not guessed at: the default stays in force and
# `monzo-glance status` prints a `config` line saying why.

# ---- The grace period -------------------------------------------------------------------------
# In the first days of a month a single charge decides whether you are "over" or "under". On
# days 1..pace_grace_days the pound sign on the bar stays neutral (no green, no amber); the hover
# card still shows every figure. 0 turns the grace period off. Whole number, 0 to 31.
pace_grace_days = 3

# ---- What counts as spending ------------------------------------------------------------------
# A transaction counts when it is a spend (a negative amount) that Monzo counts in spending
# (`include_in_spending`), and it carries none of the tags below. Pot moves and internal
# transfers are excluded by Monzo itself; money coming in (positive amounts — salary, refunds,
# transfers in) is not spending. There is nothing to configure for those.

# The tag you put on one-off purchases (a new roof, a wedding gift) that should not move your
# monthly pace. In Monzo a tag is written in a transaction's notes as "#tag", so type "#One-off"
# in the notes. They are left out of this month and of the usual month, and the card's note says
# how many were left out. "" means you have no such tag.
one_off_tag = "One-off"

# More tags whose transactions are left out entirely, without a note: money you get back
# (expenses your employer reimburses, say). Default: none.
excluded_tags = []
# excluded_tags = ["Reimbursable", "Work travel"]

# ---- Where the usual month may start ----------------------------------------------------------
# Your "usual month" is computed, never typed in: the average of your own complete months, the
# newest twelve at most. If your older months are not worth comparing with (your life changed, or
# your history only goes back so far), name the first month that should count, as "YYYY-MM". No
# month before it is used. Default: not set.
# usual_since = "2025-01"

# ---- The card's rows: your spending groups ----------------------------------------------------
# The card shows ONE ROW PER MONZO CATEGORY (a transaction's "category" field), in this order:
# groceries, eating_out, shopping, transport, entertainment, holidays, cash, expenses, bills,
# general — so a fresh Monzo Glance install needs no mapping here at all. Define any [[groups]] tables
# below to take over and make the rows yourself. Rules:
#   - one to ten groups; a category belongs to one group only;
#   - the LAST group also takes every category you did not list (Monzo's own "general" is the
#     default catch-all), and `monzo-glance status` names those under `unmapped`;
#   - if you define any [[groups]] here, they replace the default map entirely.

# The defaults, written out (uncomment all of them to start editing):

# [[groups]]
# name = "Groceries"
# categories = ["groceries"]
#
# [[groups]]
# name = "Eating out"
# categories = ["eating_out"]
#
# [[groups]]
# name = "Shopping"
# categories = ["shopping"]
#
# [[groups]]
# name = "Transport"
# categories = ["transport"]
#
# [[groups]]
# name = "Entertainment"
# categories = ["entertainment"]
#
# [[groups]]
# name = "Holidays"
# categories = ["holidays"]
#
# [[groups]]
# name = "Cash"
# categories = ["cash"]
#
# [[groups]]
# name = "Expenses"
# categories = ["expenses"]
#
# [[groups]]
# name = "Bills"
# categories = ["bills"]
#
# [[groups]]
# name = "General"
# categories = ["general"]

# ---- Not settings -----------------------------------------------------------------------------
# The usual month's figures are never configured. Whatever `usual_since` says, they come from
# your own complete months, and the card's note names the months that were used
# ("usual = Jan–Sep 2025 average"). It needs one complete month before it says anything.
#
# The ledger is not a setting either: Monzo exposes only the last 90 days outside the five
# minutes after login, so Monzo Glance keeps every transaction it has seen in
# ~/.cache/monzo-glance/ledger.json and builds the usual month from that.
#
# To check the engine against Monzo itself: total your spending for a range in the Monzo app (or
# a spreadsheet export), and run `monzo-glance check FROM TO` (dates as YYYY-MM-DD). The two totals
# should agree to the pound.
